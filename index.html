/* src/utils/format.js */
function onlyDigits(value) {
  return String(value || "").replace(/\D/g, "");
}

function cleanText(value) {
  return String(value || "").replace(/\s+/g, " ").trim();
}

function stripZeros(value) {
  const cleaned = onlyDigits(value).replace(/^0+/, "");
  return cleaned || "0";
}

function formatMoneyFromCents(raw) {
  const digits = onlyDigits(raw);
  if (!digits) return "";
  const cents = Number.parseInt(digits, 10);
  return new Intl.NumberFormat("pt-BR", {
    style: "currency",
    currency: "BRL",
  }).format(cents / 100);
}

function centsToNumber(raw) {
  const digits = onlyDigits(raw);
  return digits ? Number.parseInt(digits, 10) / 100 : 0;
}

function formatDate(raw) {
  const digits = onlyDigits(raw);
  if (digits.length !== 8 || digits === "00000000") return "";
  const day = digits.slice(0, 2);
  const month = digits.slice(2, 4);
  const year = digits.slice(4, 8);
  return `${day}/${month}/${year}`;
}

function formatCpfCnpj(type, value) {
  const digits = onlyDigits(value);
  if (type === "1" && digits.length >= 11) {
    const cpf = digits.slice(-11);
    return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
  }
  if (type === "2" && digits.length >= 14) {
    const cnpj = digits.slice(-14);
    return cnpj.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");
  }
  return stripZeros(digits);
}

function normalizeSearch(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function downloadText(filename, content, mime = "text/plain;charset=utf-8") {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.click();
  URL.revokeObjectURL(url);
}

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    await navigator.clipboard.writeText(text);
    return;
  }

  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();
  document.execCommand("copy");
  area.remove();
}

function csvEscape(value) {
  const text = String(value ?? "");
  if (/["\n;]/.test(text)) return `"${text.replace(/"/g, '""')}"`;
  return text;
}

/* src/parser/cnab240Parser.js */
const layouts = [bbCnab240Layout];

function waitFrame() {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

function detectLineEnding(text) {
  return text.includes("\r\n") ? "\r\n" : "\n";
}

function detectType(line) {
  return line[7] || "";
}

function detectSegment(line) {
  return line[13] || "";
}

function makeRecord(line, lineNumber, layout, parsed = {}) {
  const type = detectType(line);
  const segment = detectSegment(line);
  return {
    id: `${lineNumber}-${type}-${segment || "x"}`,
    lineNumber,
    type,
    typeLabel: recordKinds[type] || "Registro desconhecido",
    segment,
    raw: line,
    length: line.length,
    layout: layout.id,
    parsed,
    warnings: [],
  };
}

function validateLine(record) {
  if (record.length !== 240) {
    record.warnings.push(`Registro com ${record.length} caracteres; esperado: 240.`);
  }
  if (!record.typeLabel || record.typeLabel === "Registro desconhecido") {
    record.warnings.push("Tipo de registro nao reconhecido na posicao 8.");
  }
  if (record.type === "3" && !record.segment) {
    record.warnings.push("Segmento ausente na posicao 14.");
  }
}

function parseLine(line, lineNumber, layout, currentLot) {
  const type = detectType(line);
  const segment = detectSegment(line);
  let parsed = {};

  if (type === "0") parsed = layout.parseHeaderArquivo(line);
  if (type === "1") parsed = layout.parseHeaderLote(line);
  if (type === "5") parsed = layout.parseTrailerLote(line);
  if (type === "9") parsed = layout.parseTrailerArquivo(line);
  if (type === "3" && segment === "A") parsed = layout.parseSegmentA(line, false);
  if (type === "3" && segment === "B") parsed = layout.parseSegmentB(line, false);

  const record = makeRecord(line, lineNumber, layout, parsed);
  validateLine(record);
  if (currentLot) record.currentLot = currentLot;
  return record;
}

function hydrateCnabRecordFields(record) {
  if (record.parsed?.fields?.length) return record.parsed.fields;
  if (!record?.raw) return [];

  const layout = layouts[0];
  let parsed = {};
  if (record.type === "3" && record.segment === "A") parsed = layout.parseSegmentA(record.raw);
  if (record.type === "3" && record.segment === "B") parsed = layout.parseSegmentB(record.raw);
  if (record.type === "0") parsed = layout.parseHeaderArquivo(record.raw);
  if (record.type === "1") parsed = layout.parseHeaderLote(record.raw);
  if (record.type === "5") parsed = layout.parseTrailerLote(record.raw);
  if (record.type === "9") parsed = layout.parseTrailerArquivo(record.raw);

  record.parsed = { ...(record.parsed || {}), fields: parsed.fields || [] };
  return record.parsed.fields;
}

function addRecord(result, record) {
  result.records.push(record);
  result.counts.total += 1;
  result.counts.byType[record.typeLabel] = (result.counts.byType[record.typeLabel] || 0) + 1;
  if (record.segment) {
    result.counts.bySegment[record.segment] = (result.counts.bySegment[record.segment] || 0) + 1;
  }
  if (record.warnings.length) {
    result.warnings.push({ lineNumber: record.lineNumber, messages: record.warnings });
  }
}

function buildPaymentSearch(payment) {
  return normalizeSearch(
    [
      payment.favoredName,
      payment.cpfCnpj,
      payment.bank,
      payment.bankName,
      payment.agency,
      payment.account,
      payment.amountFormatted,
      payment.amount,
      payment.documentNumber,
      payment.ourNumber,
      payment.yourNumber,
      payment.occurrences,
      payment.occurrenceDescription,
    ].join(" ")
  );
}

const nonErrorOccurrenceCodes = new Set(["00", "ZA", "BD"]);

const occurrenceDescriptions = {
  "00": "Registro enviado",
  "01": "Insuficiencia de fundos - debito nao efetuado",
  "02": "Credito ou debito cancelado pelo pagador/credor",
  "03": "Debito autorizado pela agencia - efetuado",
  AA: "Controle invalido",
  AB: "Tipo de operacao invalido",
  AC: "Tipo de servico invalido",
  AD: "Forma de lancamento invalida",
  AE: "Tipo/numero de inscricao invalido",
  AF: "Codigo de convenio invalido",
  AG: "Agencia/conta corrente/DV invalido",
  AH: "Numero sequencial do registro no lote invalido",
  AI: "Codigo de segmento de detalhe invalido",
  AJ: "Tipo de movimento invalido",
  AK: "Codigo da camara de compensacao invalido",
  AL: "Banco favorecido ou depositario invalido",
  AM: "Agencia mantenedora da conta do favorecido invalida",
  AN: "Conta corrente/DV do favorecido invalido",
  AO: "Nome do favorecido nao informado",
  AP: "Data de lancamento invalida",
  AQ: "Tipo/quantidade da moeda invalido",
  AR: "Valor do lancamento invalido",
  AS: "Aviso ao favorecido - identificacao invalida",
  AT: "Tipo/numero de inscricao do favorecido invalido",
  AU: "Logradouro do favorecido nao informado",
  AV: "Numero do local do favorecido nao informado",
  BD: "Inclusão Efetuada com Sucesso",
  ZA: "Ocorrencia informativa tratada como sem erro",
};

function parseOccurrenceCodes(occurrences) {
  const compact = String(occurrences || "").replace(/\s+/g, "").toUpperCase();
  if (!compact) return [];
  return compact.match(/.{1,2}/g) || [];
}

function describeOccurrences(occurrences, isRemessa) {
  const codes = parseOccurrenceCodes(occurrences);
  if (!codes.length) return "Sem ocorrencias";

  return codes
    .map((code) => {
      let desc = occurrenceDescriptions[code];
      if (code === "00") {
        desc = "Registro enviado";
      }
      return `${code} - ${desc || "Descricao nao cadastrada"}`;
    })
    .join("; ");
}

function hasReturnError(occurrences) {
  const codes = parseOccurrenceCodes(occurrences);
  return codes.some((code) => !nonErrorOccurrenceCodes.has(code));
}

function mergePayments(result) {
  const payments = [];
  const pendingByLot = new Map();
  const fileHeader = result.records.find((record) => record.type === "0") || null;
  const isRemessa = fileHeader?.parsed?.fileType === "1";

  for (const record of result.records) {
    if (record.type !== "3") continue;
    const parsed = record.parsed || {};
    const lot = parsed.lot || record.currentLot || "";

    if (record.segment === "A") {
      const occurrenceError = hasReturnError(parsed.occurrences);
      const occurrenceDescription = describeOccurrences(parsed.occurrences, isRemessa);
      const payment = {
        id: `${lot}:${record.lineNumber}`,
        key: `${lot}:${record.lineNumber}`,
        lineNumber: record.lineNumber,
        segmentARecord: record,
        segmentBRecord: null,
        lot,
        sequence: parsed.sequence || "",
        favoredName: parsed.favoredName || "",
        cpfCnpj: "",
        bank: parsed.favoredBank || "",
        bankName: parsed.favoredBankName || "",
        agency: parsed.agency || "",
        account: parsed.account || "",
        accountDigit: parsed.accountDigit || "",
        amount: parsed.amount || 0,
        amountFormatted: parsed.amountFormatted || "",
        paymentDate: parsed.paymentDate || "",
        documentNumber: parsed.documentNumber || "",
        ourNumber: parsed.ourNumber || "",
        yourNumber: parsed.yourNumber || "",
        occurrences: parsed.occurrences || "",
        occurrenceDescription,
        hasOccurrenceError: occurrenceError,
        status: occurrenceError ? "Com erro" : "OK",
        warnings: [...record.warnings],
      };
      payments.push(payment);
      pendingByLot.set(lot, payment);
    }

    if (record.segment === "B") {
      const payment = pendingByLot.get(lot);
      if (!payment || payment.segmentBRecord) continue;
      payment.segmentBRecord = record;
      payment.cpfCnpj = parsed.registrationNumber || "";
      payment.city = parsed.city || "";
      payment.state = parsed.state || "";
      payment.address = parsed.address || "";
      payment.warnings = [...payment.warnings, ...record.warnings];
      pendingByLot.delete(lot);
    }
  }

  result.payments = payments.map((payment) => ({
    ...payment,
    searchText: buildPaymentSearch(payment),
  }));
}

function summarize(result) {
  result.headers.file = result.records.find((record) => record.type === "0") || null;
  result.headers.lots = result.records.filter((record) => record.type === "1");
  result.trailers.lots = result.records.filter((record) => record.type === "5");
  result.trailers.file = result.records.find((record) => record.type === "9") || null;
  result.totals.payments = result.payments.length;
  result.totals.value = result.payments.reduce((sum, item) => sum + (item.amount || 0), 0);
  result.totals.occurrences = result.payments.filter((item) => item.hasOccurrenceError).length;
}

function compactParsedResult(result) {
  // result.records = result.records.filter((record) => record.type !== "3");
  return result;
}

async function parseCnab240Text(text, options = {}) {
  const layout = layouts[0];
  const result = {
    layout: layout.name,
    fileName: options.fileName || "",
    importedAt: new Date().toISOString(),
    records: [],
    payments: [],
    warnings: [],
    counts: { total: 0, byType: {}, bySegment: {} },
    headers: { file: null, lots: [] },
    trailers: { file: null, lots: [] },
    totals: { payments: 0, value: 0, occurrences: 0 },
  };

  const lines = text
    .replace(/\uFEFF/g, "")
    .split(detectLineEnding(text))
    .map((line) => line.replace(/\r$/, ""))
    .filter((line) => line.length > 0);

  let currentLot = "";
  const yieldEvery = options.yieldEvery ?? 5000;
  for (let index = 0; index < lines.length; index += 1) {
    const line = lines[index];
    const record = parseLine(line, index + 1, layout, currentLot);
    if (record.type === "1") currentLot = record.parsed.lot || currentLot;
    addRecord(result, record);

    if (yieldEvery > 0 && index % yieldEvery === 0) {
      options.onProgress?.({ current: index + 1, total: lines.length });
      await waitFrame();
    }
  }

  mergePayments(result);
  summarize(result);
  compactParsedResult(result);
  options.onProgress?.({ current: lines.length, total: lines.length });
  return result;
}

function readFileAsText(file, onProgress) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onprogress = (event) => {
      if (event.lengthComputable) onProgress?.({ current: event.loaded, total: event.total });
    };
    reader.readAsText(file, "ISO-8859-1");
  });
}

out = layouts[0];\n  let parsed = {};\n  if (record.type === \"3\" && record.segment === \"A\") parsed = layout.parseSegmentA(record.raw);\n  if (record.type === \"3\" && record.segment === \"B\") parsed = layout.parseSegmentB(record.raw);\n  if (record.type === \"0\") parsed = layout.parseHeaderArquivo(record.raw);\n  if (record.type === \"1\") parsed = layout.parseHeaderLote(record.raw);\n  if (record.type === \"5\") parsed = layout.parseTrailerLote(record.raw);\n  if (record.type === \"9\") parsed = layout.parseTrailerArquivo(record.raw);\n\n  record.parsed = { ...(record.parsed || {}), fields: parsed.fields || [] };\n  return record.parsed.fields;\n}\n\nfunction addRecord(result, record) {\n  result.records.push(record);\n  result.counts.total += 1;\n  result.counts.byType[record.typeLabel] = (result.counts.byType[record.typeLabel] || 0) + 1;\n  if (record.segment) {\n    result.counts.bySegment[record.segment] = (result.counts.bySegment[record.segment] || 0) + 1;\n  }\n  if (record.warnings.length) {\n    result.warnings.push({ lineNumber: record.lineNumber, messages: record.warnings });\n  }\n}\n\nfunction buildPaymentSearch(payment) {\n  return normalizeSearch(\n    [\n      payment.favoredName,\n      payment.cpfCnpj,\n      payment.bank,\n      payment.bankName,\n      payment.agency,\n      payment.account,\n      payment.amountFormatted,\n      payment.amount,\n      payment.documentNumber,\n      payment.ourNumber,\n      payment.yourNumber,\n      payment.occurrences,\n      payment.occurrenceDescription,\n    ].join(\" \")\n  );\n}\n\nconst nonErrorOccurrenceCodes = new Set([\"00\", \"ZA\", \"BD\"]);\n\nconst occurrenceDescriptions = {\n  \"00\": \"Registro enviado\",\n  \"01\": \"Insuficiencia de fundos - debito nao efetuado\",\n  \"02\": \"Credito ou debito cancelado pelo pagador/credor\",\n  \"03\": \"Debito autorizado pela agencia - efetuado\",\n  AA: \"Controle invalido\",\n  AB: \"Tipo de operacao invalido\",\n  AC: \"Tipo de servico invalido\",\ function parseFileWithWorker(file, onProgress) {
  if (!window.Worker || !window.Blob || !window.URL) {
    return Promise.reject(new Error("Web Worker indisponivel neste navegador."));
  }

  return new Promise((resolve, reject) => {
    const blob = new Blob([parserWorkerSource], { type: "text/javascript;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const worker = new Worker(url);

    const cleanup = () => {
      worker.terminate();
      URL.revokeObjectURL(url);
    };

    worker.onmessage = (event) => {
      const message = event.data || {};
      if (message.type === "progress") {
        onProgress?.(message.progress);
        return;
      }
      if (message.type === "done") {
        cleanup();
        resolve(message.result);
        return;
      }
      if (message.type === "error") {
        cleanup();
        reject(new Error(message.error || "Falha ao processar arquivo no Worker."));
      }
    };

    worker.onerror = (event) => {
      cleanup();
      reject(new Error(event.message || "Erro no Worker de importacao."));
    };

    worker.postMessage({ type: "parseFile", file, fileName: file.name });
  });
}

function createApp(root) {
  const state = {
    parseResult: null,
    filteredPayments: [],
    query: "",
    segmentFilter: "todos",
    occurrenceFilter: "todos",
    lotFilter: "todos",
    page: 1,
    pageSize: 50,
    selectedPayment: null,
    activeView: "movimentos",
    theme: localStorage.getItem("cnab-theme") || "moderno",
    sortColumn: "lineNumber",
    sortAsc: true,
    loading: false,
    progress: null,
    message: "",
    searchTimer: null,
  };

  function setState(patch) {
    Object.assign(state, patch);
    render();
  }

  function updateImportProgress(progress, message) {
    state.progress = progress;
    state.message = message;
    state.loading = true;
    render();
  }

  function applyFilters() {
    if (!state.parseResult) {
      state.filteredPayments = [];
      return;
    }
    const query = normalizeSearch(state.query);
    state.filteredPayments = state.parseResult.payments.filter((payment) => {
      const matchesQuery = !query || payment.searchText.includes(query);
      const matchesOccurrence =
        state.occurrenceFilter === "todos" ||
        (state.occurrenceFilter === "com" && payment.hasOccurrenceError) ||
        (state.occurrenceFilter === "sem" && !payment.hasOccurrenceError);
      
      const matchesLot =
        state.lotFilter === "todos" ||
        String(payment.lot) === state.lotFilter;

      return matchesQuery && matchesOccurrence && matchesLot;
    });
    const maxPage = Math.max(1, Math.ceil(state.filteredPayments.length / state.pageSize));
    if (state.page > maxPage) state.page = maxPage;
  }

  async function handleFile(file) {
    if (!file) return;
    setState({
      loading: true,
      progress: { current: 0, total: file.size, stage: "reading" },
      message: "Lendo arquivo...",
    });
    try {
      const parsed = await parseFileWithWorker(file, (progress) => {
        const message =
          progress.stage === "finalizing"
            ? "Finalizando visualizacao..."
            : progress.stage === "parsing"
              ? "Interpretando CNAB240 em segundo plano..."
              : "Lendo arquivo...";
        updateImportProgress(progress, message);
      }).catch(async () => {
        const text = await readFileAsText(file, (progress) =>
          updateImportProgress({ ...progress, stage: "reading" }, "Lendo arquivo...")
        );
        setState({ message: "Interpretando CNAB240..." });
        return parseCnab240Text(text, {
          fileName: file.name,
          onProgress: (progress) =>
            updateImportProgress({ ...progress, stage: "parsing" }, "Interpretando CNAB240..."),
        });
      });
      setState({
        loading: true,
        progress: { current: 1, total: 1, stage: "finalizing" },
        message: "Finalizando visualizacao...",
      });
      state.parseResult = parsed;
      state.query = "";
      state.lotFilter = "todos";
      state.page = 1;
      state.selectedPayment = parsed.payments[0] || null;
      applyFilters();
      setState({
        loading: false,
        progress: null,
        message: `${parsed.counts.total} registros importados.`,
      });
    } catch (error) {
      setState({
        loading: false,
        progress: null,
        message: `Falha ao ler arquivo: ${error.message || error}`,
      });
    }
  }

  function bindEvents() {
    root.querySelector("#file-input")?.addEventListener("change", (event) => {
      handleFile(event.target.files?.[0]);
      event.target.value = "";
    });

    const dropZone = root.querySelector(".drop-zone");
    dropZone?.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropZone.classList.add("dragging");
    });
    dropZone?.addEventListener("dragleave", () => dropZone.classList.remove("dragging"));
    dropZone?.addEventListener("drop", (event) => {
      event.preventDefault();
      dropZone.classList.remove("dragging");
      handleFile(event.dataTransfer.files?.[0]);
    });

    root.querySelector("#search")?.addEventListener("input", (event) => {
      state.query = event.target.value;
      state.page = 1;
      clearTimeout(state.searchTimer);
      state.searchTimer = setTimeout(() => {
        applyFilters();
        renderMovementsOnly();
      }, 80);
    });

    root.querySelector("#occurrence-filter")?.addEventListener("change", (event) => {
      state.occurrenceFilter = event.target.value;
      state.page = 1;
      applyFilters();
      renderMovementsOnly();
    });

    root.querySelector("#lot-filter")?.addEventListener("change", (event) => {
      state.lotFilter = event.target.value;
      state.page = 1;
      applyFilters();
      renderMovementsOnly();
    });

    root.querySelector("#page-size")?.addEventListener("change", (event) => {
      state.pageSize = Number(event.target.value);
      state.page = 1;
      applyFilters();
      renderMovementsOnly();
    });

    root.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => {
        state.page = 1;
        setState({ activeView: button.dataset.view });
      });
    });

    root.querySelector("#movements-content")?.addEventListener("click", (event) => {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        state.page = Number(pageButton.dataset.page);
        renderMovementsOnly();
        return;
      }
      root.querySelector(".movements-table")?.addEventListener("click", (e) => {
        const th = e.target.closest("th.sortable");
        if (th) {
          const col = th.dataset.sort;
          if (state.sortColumn === col) {
            state.sortAsc = !state.sortAsc;
          } else {
            state.sortColumn = col;
            state.sortAsc = true;
          }
          render();
          return;
        }
        const row = e.target.closest(".payment-row");
        if (row) {
          const id = row.dataset.id;
          setState({
            selectedPayment: state.parseResult.payments.find((p) => p.id === id) || null,
          });
        }
      });
      const row = event.target.closest("[data-select-payment]");
      if (row) {
        const payment = state.filteredPayments.find((item) => item.id === row.dataset.selectPayment);
        setState({ selectedPayment: payment || null });
      }
    });

    root.querySelector("#theme-select")?.addEventListener("change", (event) => {
      state.theme = event.target.value;
      localStorage.setItem("cnab-theme", state.theme);
      render();
    });

    root.querySelector("#export-csv")?.addEventListener("click", () => {
      if (state.filteredPayments.length) exportPaymentsCsv(state.filteredPayments);
    });

    root.querySelector("#copy-line")?.addEventListener("click", async () => {
      if (!state.selectedPayment) return;
      await copyText(formatPaymentLine(state.selectedPayment));
      setState({ message: "Linha formatada copiada." });
    });

    root.querySelector("#close-details")?.addEventListener("click", () => setState({ selectedPayment: null }));
  }

  function progressBar() {
    if (!state.loading || !state.progress?.total) return "";
    const pct = Math.min(100, Math.round((state.progress.current / state.progress.total) * 100));
    return `<div class="progress"><span style="width:${pct}%"></span></div>`;
  }

  function statCards() {
    const result = state.parseResult;
    const totalValue = result ? formatMoneyFromCents(String(Math.round(result.totals.value * 100)).padStart(3, "0")) : "R$ 0,00";
    return `
      <div class="stats-grid">
        ${stat("Registros", result?.counts.total || 0, "Total lido do arquivo")}
        ${stat("Pagamentos", result?.totals.payments || 0, "Segmentos A agrupados")}
        ${stat("Valor", totalValue, "Soma dos pagamentos")}
        ${stat("Erros", result?.totals.occurrences || 0, "Ocorrencias diferentes de 00")}
      </div>
    `;
  }

  function stat(label, value, hint) {
    return `<section class="stat"><span>${label}</span><strong>${value}</strong><small>${hint}</small></section>`;
  }

  function detectedBank() {
    if (!state.parseResult?.headers?.file) return null;
    const code = state.parseResult.headers.file.parsed.bank;
    const parsedName = state.parseResult.headers.file.parsed.bankName;
    const profile = bankProfiles[code];
    if (profile) return { code, ...profile };

    const name = parsedName || `Banco ${code}`;
    const words = name
      .replace(/^Banco\s+/i, "")
      .split(/\s+/)
      .filter(Boolean);
    const initials = words.length > 1
      ? words.slice(0, 3).map((word) => word[0]).join("")
      : (words[0] || code).slice(0, 4);

    return {
      code,
      name,
      abbr: initials.toUpperCase(),
      badgeBg: "#344054",
      badgeText: "#ffffff",
      colorScheme: "light",
      primary: "#344054",
      primary2: "#475467",
      bg: "#f4f5f7",
      panel: "#ffffff",
      panel2: "#eaecf0",
      text: "#1d2939",
      muted: "#667085",
      line: "#344054",
      lineSoft: "#d0d5dd",
    };
  }

  function sidebar() {
    const result = state.parseResult;
    const segments = result?.counts.bySegment || {};
    const bank = detectedBank();

    let brandMarkHtml;
    if (bank?.icon) {
      // Extract the src from the icon HTML and render a clean <img>
      const srcMatch = bank.icon.match(/src="([^"]+)"/);
      const imgSrc = srcMatch ? srcMatch[1] : '';
      brandMarkHtml = imgSrc
        ? `<img class="brand-mark-icon" src="${imgSrc}" alt="${bank.name}" />`
        : `<span class="brand-mark" style="background:${bank.badgeBg};color:${bank.badgeText}">${bank.abbr}</span>`;
    } else if (bank) {
      const fs = bank.abbr.length > 3 ? "9px" : bank.abbr.length > 2 ? "10px" : "12px";
      brandMarkHtml = `<span class="brand-mark" style="background:${bank.badgeBg};color:${bank.badgeText};font-size:${fs};letter-spacing:-0.5px;">${bank.abbr}</span>`;
    } else {
      brandMarkHtml = `<span class="brand-mark">240</span>`;
    }

    return `
      <aside class="sidebar">
        <div class="brand">
          ${brandMarkHtml}
          <div><strong>${bank ? bank.name : "CNAB Viewer"}</strong><small>${bank ? `Banco ${bank.code}` : "Local e offline"}</small></div>
        </div>
        <label class="drop-zone">
          <input id="file-input" type="file" accept="*.*" />
          <span class="icon">${icons.upload}</span>
          <strong>Selecionar CNAB</strong>
          <small>ou arraste .txt, .rem, .ret</small>
        </label>
        ${progressBar()}
        <nav class="nav">
          ${navButton("movimentos", icons.table, "Movimentos")}
          ${navButton("hex-viewer", icons.code, "Mapa de Campos")}
          ${navButton("estrutura", icons.file, "Estrutura")}
          ${navButton("validacao", icons.warning, "Auditoria")}
        </nav>
        <div class="side-section">
          <span class="side-title">Segmentos</span>
          ${["A", "B"].map((seg) => `<div class="side-row"><span>Segmento ${seg}</span><strong>${segments[seg] || 0}</strong></div>`).join("")}
        </div>
        <div class="side-section" style="margin-top: 14px">
          <span class="side-title">Aparencia</span>
          <select id="theme-select">
            <option value="moderno" ${state.theme === "moderno" ? "selected" : ""}>Banco Moderno</option>
            <option value="terminal" ${state.theme === "terminal" ? "selected" : ""}>Terminal Bancario</option>
            <option value="cyberpunk" ${state.theme === "cyberpunk" ? "selected" : ""}>Cyberpunk Finance</option>
            <option value="multibanco" ${state.theme === "multibanco" ? "selected" : ""}>Cores do Banco</option>
            <option value="light" ${state.theme === "light" ? "selected" : ""}>Sistema Claro</option>
            <option value="dark" ${state.theme === "dark" ? "selected" : ""}>Sistema Escuro</option>
          </select>
        </div>
        <div style="margin-top:auto;padding-top:16px;text-align:center">
          <small style="font-size:10px;color:var(--muted);opacity:0.6;letter-spacing:0.04em;">v${APP_VERSION}</small>
        </div>
      </aside>
    `;
  }

  function navButton(view, icon, label) {
    return `<button class="${state.activeView === view ? "active" : ""}" data-view="${view}"><span class="icon">${icon}</span>${label}</button>`;
  }

  function getUniqueLots() {
    if (!state.parseResult) return [];
    const lots = state.parseResult.payments.map(p => p.lot);
    return [...new Set(lots)].sort((a, b) => Number(a) - Number(b));
  }

  function toolbar() {
    const uniqueLots = getUniqueLots();
    const lotOptions = uniqueLots.map(lot => 
      `<option value="${lot}" ${state.lotFilter === String(lot) ? "selected" : ""}>Lote ${lot}</option>`
    ).join("");

    return `
      <div class="toolbar">
        <div class="search-box">
          <span class="icon">${icons.search}</span>
          <input id="search" value="${escapeHtml(state.query)}" placeholder="Buscar por nome, CPF/CNPJ, banco, agencia, conta, valor, documento..." />
        </div>
        <select id="lot-filter" aria-label="Filtro de lotes">
          <option value="todos" ${state.lotFilter === "todos" ? "selected" : ""}>Todos os lotes</option>
          ${lotOptions}
        </select>
        <select id="occurrence-filter" aria-label="Filtro de ocorrencias">
          <option value="todos" ${state.occurrenceFilter === "todos" ? "selected" : ""}>Todos os retornos</option>
          <option value="com" ${state.occurrenceFilter === "com" ? "selected" : ""}>Com erro</option>
          <option value="sem" ${state.occurrenceFilter === "sem" ? "selected" : ""}>Sem erro</option>
        </select>
        <select id="page-size" aria-label="Itens por pagina">
          ${pageSizeOptions.map((size) => `<option value="${size}" ${state.pageSize === size ? "selected" : ""}>${size}/pag</option>`).join("")}
        </select>
        <button class="icon-button" id="export-csv" title="Exportar CSV" ${state.filteredPayments.length ? "" : "disabled"}>${icons.download}</button>
      </div>
    `;
  }

  function th(column, label, cssClass = "") {
    const isSort = state.sortColumn === column;
    const arrow = isSort ? (state.sortAsc ? " ↑" : " ↓") : "";
    const activeClass = isSort ? "sort-active" : "";
    return `<th class="sortable ${cssClass} ${activeClass}" data-sort="${column}" style="cursor: pointer; user-select: none;" title="Ordenar por ${label}">${label}${arrow}</th>`;
  }

  function movementsContent() {
    let sorted = [...state.filteredPayments];
    if (state.sortColumn) {
      sorted.sort((a, b) => {
        let valA = a[state.sortColumn];
        let valB = b[state.sortColumn];
        if (typeof valA === "string") valA = valA.toLowerCase();
        if (typeof valB === "string") valB = valB.toLowerCase();
        if (valA < valB) return state.sortAsc ? -1 : 1;
        if (valA > valB) return state.sortAsc ? 1 : -1;
        return 0;
      });
    }

    const totalPages = Math.max(1, Math.ceil(sorted.length / state.pageSize));
    const start = (state.page - 1) * state.pageSize;
    const pageItems = sorted.slice(start, start + state.pageSize);
    return `
      <div class="table-shell movements-table">
        <table>
          <thead>
            <tr>
              ${th("lineNumber", "Linha")}
              ${th("favoredName", "Nome favorecido")}
              ${th("cpfCnpj", "CPF/CNPJ")}
              ${th("bankName", "Banco")}
              ${th("agency", "Agencia")}
              ${th("account", "Conta")}
              ${th("amount", "Valor", "text-right")}
              ${th("documentNumber", "Documento")}
              ${th("status", "Status")}
            </tr>
          </thead>
          <tbody>
            ${pageItems.map(paymentRow).join("") || `<tr><td colspan="9" class="muted-cell">Nenhum pagamento encontrado.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <span>${state.filteredPayments.length} pagamentos filtrados</span>
        <div>
          <button data-page="${Math.max(1, state.page - 1)}" ${state.page === 1 ? "disabled" : ""}>Anterior</button>
          <strong>${state.page} / ${totalPages}</strong>
          <button data-page="${Math.min(totalPages, state.page + 1)}" ${state.page === totalPages ? "disabled" : ""}>Proxima</button>
        </div>
      </div>
    `;
  }

  function renderMovementsOnly() {
    const container = root.querySelector("#movements-content");
    if (!container || state.activeView !== "movimentos") {
      render();
      return;
    }

    container.innerHTML = movementsContent();
    const exportButton = root.querySelector("#export-csv");
    if (exportButton) exportButton.disabled = !state.filteredPayments.length;
  }

  function movementsView() {
    if (!state.parseResult) return emptyState();
    return `
      ${toolbar()}
      <div id="movements-content">${movementsContent()}</div>
    `;
  }

  function paymentRow(payment) {
    const selected = state.selectedPayment?.id === payment.id ? "selected" : "";
    const issue = payment.hasOccurrenceError || payment.warnings.length ? "issue" : "";
    const occurrenceLabel = payment.hasOccurrenceError ? payment.occurrences : "OK";
    const tooltip = payment.occurrenceDescription || "Sem ocorrencias";
    return `
      <tr class="${selected} ${issue}" data-select-payment="${payment.id}" title="${escapeHtml(tooltip)}">
        <td>${payment.lineNumber}</td>
        <td><strong>${escapeHtml(payment.favoredName || "Sem nome")}</strong><small>Lote ${payment.lot} Seq ${payment.sequence}</small></td>
        <td>${escapeHtml(payment.cpfCnpj || "-")}</td>
        <td>${escapeHtml(payment.bank)}<small>${escapeHtml(payment.bankName)}</small></td>
        <td>${escapeHtml(payment.agency || "-")}</td>
        <td>${escapeHtml(payment.account || "-")}${payment.accountDigit ? `-${escapeHtml(payment.accountDigit)}` : ""}</td>
        <td class="text-right"><strong>${escapeHtml(payment.amountFormatted || "-")}</strong><small>${escapeHtml(payment.paymentDate || "")}</small></td>
        <td>${escapeHtml(payment.documentNumber || payment.ourNumber || "-")}</td>
        <td><span class="badge ${issue ? "warn" : "ok"}">${escapeHtml(occurrenceLabel)}</span></td>
      </tr>
    `;
  }

  function recordCard(title, record, description = "") {
    if (!record) return `<section class="info-card"><h3>${title}</h3><p class="muted">Nao encontrado.</p></section>`;
    return `
      <section class="info-card">
        <h3>${title}</h3>
        ${description ? `<div class="febraban-tip"><em>Descrição:</em> ${description}</div>` : ""}
        <div class="field-grid">
          ${(record.parsed.fields || []).map((item) => `<div><span title="Posicao ${item.start}-${item.end} (${item.end - item.start + 1} chars)">${escapeHtml(item.label)}</span><strong>${escapeHtml(item.value || "-")}</strong></div>`).join("")}
        </div>
      </section>
    `;
  }

  function structureView() {
    if (!state.parseResult) return emptyState();
    const result = state.parseResult;
    return `
      <div class="cards-grid">
        ${recordCard("Header do arquivo", result.headers.file, "Abre o arquivo e contém dados da empresa (nome, banco) e data de geração. Só pode existir um por arquivo (Tipo 0).")}
        ${result.headers.lots.map((record, index) => recordCard(`Header lote ${index + 1}`, record, "Inicia um grupo de pagamentos do mesmo tipo de serviço. Deve ter um Trailer de Lote correspondente.")).join("")}
        ${result.trailers.lots.map((record, index) => {
          const lotNum = record.currentLot || (result.headers.lots[index]?.currentLot) || "";
          const lotPaymentsCount = result.payments.filter(p => String(p.lot) === String(lotNum)).length;
          
          const fields = [...(record.parsed.fields || [])];
          const hasPaymentsField = fields.some(f => f.label.toLowerCase().includes("pagamento"));
          if (!hasPaymentsField) {
            fields.push({
              label: "Quantidade de Pagamentos",
              value: String(lotPaymentsCount),
              start: 0,
              end: 0
            });
          }
          
          const recordClone = { ...record, parsed: { ...record.parsed, fields } };
          return recordCard(`Trailer lote ${index + 1}`, recordClone, "Encerra um lote, consolidando as quantidades de registros e o valor total dos pagamentos dentro deste lote.");
        }).join("")}
        ${recordCard("Trailer do arquivo", result.trailers.file, "Última linha do arquivo (Tipo 9). Totaliza a quantidade de lotes e a quantidade de registros totais.")}
      </div>
    `;
  }

  function validationView() {
    if (!state.parseResult) return emptyState();
    const warnings = state.parseResult.warnings;
    return `
      <section class="info-card">
        <h3>Validacao basica</h3>
        <p class="muted">${warnings.length ? `${warnings.length} alertas encontrados.` : "Nenhum alerta basico encontrado."}</p>
        <div class="warning-list">
          ${warnings.map((item) => `<div><strong>Linha ${item.lineNumber}</strong><span>${item.messages.map(escapeHtml).join(" ")}</span></div>`).join("")}
        </div>
      </section>
    `;
  }

  function detailsPanel() {
    const payment = state.selectedPayment;
    if (!payment) return "";
    const records = [payment.segmentARecord, payment.segmentBRecord].filter(Boolean);
    const occurrenceBlock = payment.hasOccurrenceError
      ? `<div class="occurrence-alert">
          <span>Ocorrencia de retorno</span>
          <strong>${escapeHtml(payment.occurrences)}</strong>
          <p>${escapeHtml(payment.occurrenceDescription || "Descricao nao cadastrada")}</p>
        </div>`
      : "";
    return `
      <aside class="details-panel">
        <div class="details-header">
          <div><span>Registro selecionado</span><strong>${escapeHtml(payment.favoredName || "Pagamento")}</strong></div>
          <button class="icon-button" id="close-details" title="Fechar">${icons.close}</button>
        </div>
        <div class="details-actions">
          <button id="copy-line"><span class="icon">${icons.copy}</span>Copiar linha formatada</button>
        </div>
        <div class="summary-list">
          <div><span>CPF/CNPJ</span><strong>${escapeHtml(payment.cpfCnpj || "-")}</strong></div>
          <div><span>Valor</span><strong>${escapeHtml(payment.amountFormatted || "-")}</strong></div>
          <div><span>Banco</span><strong>${escapeHtml(`${payment.bank} ${payment.bankName}`.trim())}</strong></div>
          <div><span>Conta</span><strong>${escapeHtml(payment.account || "-")}</strong></div>
          <div><span>Ocorrencias</span><strong>${escapeHtml(payment.hasOccurrenceError ? payment.occurrences : "Sem erro")}</strong></div>
          <div><span>Descricao</span><strong>${escapeHtml(payment.occurrenceDescription || "Sem ocorrencias")}</strong></div>
        </div>
        ${occurrenceBlock}
        ${records.map(detailRecord).join("")}
      </aside>
    `;
  }

  function detailRecord(record) {
    const fields = hydrateCnabRecordFields(record);
    return `
      <section class="detail-record">
        <h3>Linha ${record.lineNumber} - ${record.typeLabel}${record.segment ? ` ${record.segment}` : ""}</h3>
        <div class="field-table">
          ${fields.map((item) => `
            <div>
              <span>${item.start}-${item.end}</span>
              <strong>${escapeHtml(item.label)}</strong>
              <em>${escapeHtml(item.value || "-")}</em>
              <code>${escapeHtml(item.raw)}</code>
            </div>
          `).join("")}
        </div>
        <details>
          <summary>Valor bruto do arquivo</summary>
          <pre>${escapeHtml(record.raw)}</pre>
        </details>
      </section>
    `;
  }

  function emptyState() {
    return `
      <section class="empty">
        <span class="icon">${icons.file}</span>
        <h2>Abra um arquivo CNAB240</h2>
        <p>O processamento acontece apenas no navegador, com leitura local e sem envio de dados.</p>
      </section>
    `;
  }

  function hexRecord(record) {
    if (!record.raw) return "";
    const fields = hydrateCnabRecordFields(record);
    if (!fields || !fields.length) {
      return `<div class="hex-line"><span class="hex-field" title="Desconhecido">${escapeHtml(record.raw)}</span></div>`;
    }
    
    let html = `<div class="hex-line">`;
    let lastEnd = 0;
    const sortedFields = [...fields].sort((a, b) => a.start - b.start);
    
    for (const f of sortedFields) {
      if (f.start > lastEnd + 1) {
        html += `<span class="hex-field gap">${escapeHtml(record.raw.substring(lastEnd, f.start - 1))}</span>`;
      }
      const val = record.raw.substring(f.start - 1, f.end);
      html += `<span class="hex-field" title="${escapeHtml(f.label)} (pos: ${f.start}-${f.end}, tam: ${f.end - f.start + 1})">${escapeHtml(val)}</span>`;
      lastEnd = f.end;
    }
    if (lastEnd < record.raw.length) {
      html += `<span class="hex-field gap">${escapeHtml(record.raw.substring(lastEnd))}</span>`;
    }
    html += `</div>`;
    return html;
  }

  function hexView() {
    if (!state.parseResult) return emptyState();
    const records = state.parseResult.records;
    const totalPages = Math.max(1, Math.ceil(records.length / state.pageSize));
    const start = (state.page - 1) * state.pageSize;
    const pageItems = records.slice(start, start + state.pageSize);

    let ruler1 = "";
    let ruler2 = "";
    for (let i = 1; i <= 240; i++) {
      if (i % 10 === 0) {
        ruler1 += String(i / 10).slice(-1);
        ruler2 += "0";
      } else {
        ruler1 += " ";
        ruler2 += String(i % 10);
      }
    }

    return `
      <div class="hex-container">
        <div class="hex-ruler">${ruler1}<br>${ruler2}</div>
        ${pageItems.map(hexRecord).join("")}
      </div>
      <div class="pagination">
        <span>${records.length} linhas do arquivo</span>
        <div>
          <button data-page="${Math.max(1, state.page - 1)}" ${state.page === 1 ? "disabled" : ""}>Anterior</button>
          <strong>${state.page} / ${totalPages}</strong>
          <button data-page="${Math.min(totalPages, state.page + 1)}" ${state.page === totalPages ? "disabled" : ""}>Proxima</button>
        </div>
      </div>
    `;
  }

  function mainView() {
    if (state.activeView === "estrutura") return structureView();
    if (state.activeView === "validacao") return validationView();
    if (state.activeView === "hex-viewer") return hexView();
    return movementsView();
  }

  const bankThemeVars = ["--primary","--primary-2","--bg","--panel","--panel-2","--text","--muted","--line","--line-soft"];

  function render() {
    let datasetTheme = state.theme;
    if (state.theme === "multibanco" && state.parseResult?.headers?.file) {
      const bankCode = state.parseResult.headers.file.parsed.bank;
      const profile = bankProfiles[bankCode];
      datasetTheme = profile?.colorScheme || "light";
    }
    document.documentElement.dataset.theme = datasetTheme;

    if (state.theme === "multibanco" && state.parseResult?.headers?.file) {
      const bankCode = state.parseResult.headers.file.parsed.bank;
      const profile = bankProfiles[bankCode];
      if (profile) {
        document.documentElement.style.setProperty("--primary", profile.primary);
        document.documentElement.style.setProperty("--primary-2", profile.primary2);
        document.documentElement.style.setProperty("--bg", profile.bg);
        document.documentElement.style.setProperty("--panel", profile.panel);
        document.documentElement.style.setProperty("--panel-2", profile.panel2);
        document.documentElement.style.setProperty("--text", profile.text);
        document.documentElement.style.setProperty("--muted", profile.muted);
        document.documentElement.style.setProperty("--line", profile.line);
        document.documentElement.style.setProperty("--line-soft", profile.lineSoft);
      } else {
        bankThemeVars.forEach(v => document.documentElement.style.removeProperty(v));
      }
    } else {
      bankThemeVars.forEach(v => document.documentElement.style.removeProperty(v));
    }

    root.innerHTML = `
      <div class="app-shell">
        ${sidebar()}
        <main class="main">
          <header class="topbar">
            <div>
              <span class="eyebrow">${state.parseResult?.layout || "Visualizador CNAB240"}</span>
              <h1>${state.parseResult?.fileName ? escapeHtml(state.parseResult.fileName) : "Analise local de remessa e retorno"}</h1>
            </div>
            <p>${escapeHtml(state.message || "Pronto para importar um arquivo.")}</p>
          </header>
          ${statCards()}
          ${mainView()}
        </main>
        ${detailsPanel()}
      </div>
    `;
    bindEvents();
  }

  render();
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
